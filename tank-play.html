<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IRON DUNE • Abrams survival</title>
<style>
:root{color-scheme:dark;font-family:Inter,Segoe UI,sans-serif;color:#f3eee0;background:#101918}*{box-sizing:border-box}body{margin:0;overflow:hidden}canvas{display:block;width:100vw;height:100vh;cursor:crosshair}button{font:inherit;color:inherit;cursor:pointer;background:#243330;border:1px solid #62726b;padding:13px 20px;border-radius:6px}button:hover{background:#384a40;border-color:#eac477}button:focus-visible{outline:3px solid #ffda83;outline-offset:3px}button:disabled{opacity:.4;cursor:default}.primary{background:#eac477;color:#19211d;border:0;font-weight:800}.primary:hover{background:#ffe1a0}.overlay{position:fixed;inset:0;background:#081411ad;display:flex;align-items:center;padding:5vw;overflow:auto;backdrop-filter:blur(5px)}.panel{width:min(920px,100%);margin:auto}.eyebrow{font:12px monospace;letter-spacing:4px;color:#eac477}h1{font-size:clamp(50px,8vw,100px);line-height:.9;margin:24px 0;letter-spacing:-5px}h2{font-size:36px;margin:16px 0}p{color:#c5cec2;line-height:1.65}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0}.card{text-align:left;padding:22px;background:#162622ec;min-height:150px}.card.selected{border-color:#eac477;box-shadow:inset 0 3px #eac477}.card strong{display:block;font-size:20px;margin:12px 0}.card small{color:#b9c9bb;line-height:1.6;display:block}.tag{font:11px monospace;color:#eac477;letter-spacing:2px}.actions{display:flex;gap:12px;flex-wrap:wrap}.hud{position:fixed;inset:22px 25px auto;display:flex;justify-content:space-between;pointer-events:none;gap:20px}.metric{background:#12221cdb;border:1px solid #62726366;border-radius:7px;padding:14px 20px;min-width:200px}.metric b{font-size:24px}.metric small{display:block;font:11px monospace;letter-spacing:2px;color:#c7d2bf;margin-bottom:8px}progress{width:100%;height:6px;accent-color:#eac477;display:block;margin-top:9px}.bottom{position:fixed;bottom:20px;left:25px;right:25px;display:flex;justify-content:space-between;gap:20px;font:12px monospace;color:#e2e8ce;pointer-events:none}.hud button{pointer-events:auto}.muted{color:#a8b8a7;font-size:12px}.toast{position:fixed;top:115px;left:50%;transform:translateX(-50%);color:#ffdc8d;font:12px monospace;pointer-events:none}[hidden]{display:none!important}@media(max-width:650px){.cards{grid-template-columns:1fr}.card{min-height:90px;padding:12px}h1{font-size:54px}.hud{inset:10px}.metric{min-width:120px;padding:10px}.bottom{font-size:10px}.overlay{align-items:flex-start}.panel{margin:20px auto}}
.health-metric{width:320px;background:#0b1716f5;border:2px solid #9bac9c;box-shadow:0 4px 20px #0006}.health-metric b{font-size:30px;font-variant-numeric:tabular-nums}.health-metric .health-state{display:block;margin-top:8px;font:700 12px monospace;letter-spacing:1px;color:#f5eee0}#health{appearance:none;-webkit-appearance:none;height:24px;border:2px solid #d7dfcd;border-radius:5px;overflow:hidden;background:#25312d;accent-color:#75ed96;--hp-color:#75ed96}#health::-webkit-progress-bar{background:#25312d}#health::-webkit-progress-value{background:var(--hp-color);transition:width .15s ease}#health::-moz-progress-bar{background:var(--hp-color)}#health.warning{--hp-color:#ffcb58;accent-color:#ffcb58}#health.critical{--hp-color:#ff635c;accent-color:#ff635c}@media(max-width:650px){.health-metric{width:clamp(140px,42vw,260px);min-width:140px}.health-metric b{font-size:22px}.health-metric .health-state{font-size:10px}#health{height:20px}.hud{gap:8px}.hud button{padding:10px}}
.feedback{display:inline-block;text-decoration:none;color:#eac477;border:1px solid #62726b;border-radius:6px;padding:13px 20px}.feedback:hover{background:#384a40}canvas.locked{cursor:none}select{display:block;width:100%;padding:10px;margin:8px 0 16px;background:#253730;color:#f3eee0;border:1px solid #84977e;border-radius:5px;font:inherit}label{font-size:12px;letter-spacing:1px}.card svg{display:block;margin:auto}#next{display:block;margin-top:8px;max-width:260px;line-height:1.4}.loadout-layout{display:grid;grid-template-columns:280px 1fr;gap:20px;margin:24px 0}.loadout-sidebar{background:#0d1c18;border:1px solid #62726b;border-radius:8px;padding:20px}.loadout-sidebar>.tag{display:block;margin-bottom:22px}.loadout-sidebar .card{padding:0;background:none;min-height:0;border-top:1px solid #62726b;padding-top:20px}.loadout-sidebar p{margin:0 0 18px}.loadout-content{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}.deployment-summary{background:#24372b;padding:12px 16px;border-left:3px solid #eac477}.loadout-content svg{height:280px;width:100%;max-width:220px}@media(max-width:750px){.loadout-layout{grid-template-columns:1fr}.loadout-content{grid-template-columns:1fr 1fr}}@media(max-width:450px){.loadout-content{grid-template-columns:1fr}}</style></head><body>
<canvas id="game" aria-label="3D tank survival battlefield"></canvas>
<div class="hud" id="hud" hidden><div class="metric health-metric"><small id="healthLabel">M1 ABRAMS / HEALTH</small><b id="hp"></b><progress id="health" aria-label="Tank health"></progress><span class="health-state" id="healthState"></span></div><div class="metric"><small id="wave"></small><b id="kills"></b><progress id="draftProgress" max="2"></progress><span class="muted" id="next"></span></div><button id="pauseButton" aria-label="Pause">Ⅱ</button></div>
<div class="bottom"><span id="controls">WASD / ARROWS move · MOUSE aim · HOLD CLICK fire<br>SPACE boost · Q / E rotate view · ESC pause · F auto-fire</span><span id="status"></span></div><div class="toast" id="toast" role="status"></div>
<div class="overlay" id="overlay"><div class="panel" id="panel"></div></div>
<script>
'use strict';
const $=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d');
let profile={rebirths:0,xp:0,points:0,best:0,kills:0,levels:[0,0,0]},storageOK=true;
try{const s=JSON.parse(localStorage.getItem('iron-dune-v1'));if(s&&Number.isFinite(s.xp)&&Array.isArray(s.levels))profile={rebirths:Number.isSafeInteger(s.rebirths)&&s.rebirths>=0?s.rebirths:0,xp:Math.max(0,s.xp),points:Math.max(0,s.points||0),best:Math.max(0,s.best||0),kills:Math.max(0,s.kills||0),levels:[0,1,2].map(i=>Math.min(5,Math.max(0,Math.floor(s.levels[i]||0))))};}catch(e){storageOK=false;}
const rank=()=>1+Math.floor(profile.xp/200);
function save(){try{localStorage.setItem('iron-dune-v1',JSON.stringify(profile));}catch(e){storageOK=false;}}
const crews=[['GUNNER','Deadeye','+25% cannon damage. Make every shell count.'],['ENGINEER','Field mechanic','Regenerate 2 armour per second.'],['DRIVER','Desert runner','+25% speed and faster boost recharge.']];
let mode='tank',lookYaw=0,lookPitch=0;
let crew=0,state='menu',player,enemies=[],shells=[],particles=[],time=0,kills=0,runXP=0,drafts=0,spawnClock=0,auto=false,boostCD=0,boostTime=0,cam=0.55,keys=new Set(),mouse={x:0,y:0,down:false,active:false},last=0,faces=[],W=0,H=0,scale=20,choices=[];

const weaponClasses=[
 ['Assault rifles',32,.16,65,1,0,'Vanguard,Sentinel,Ranger,Nomad,Falcon,Kestrel,Jackal,Warden,Paladin,Outrider'],
 ['Carbines',27,.13,48,1,0,'Scout,Trailblazer,Pathfinder,Swift,Harrier,Nomad Compact,Patrol,Rover,Wayfarer,Pioneer'],
 ['SMGs',18,.075,30,1,0,'Wasp,Hornet,Viper,Cobra,Sidewinder,Firefly,Stinger,Tempest,Surge,Needle'],
 ['Pistols',34,.28,35,1,0,'Sparrow,Finch,Kite,Robin,Merlin,Petrel,Tern,Swiftwing,Osprey,Nighthawk'],
 ['Heavy pistols',62,.48,42,1,0,'Anvil,Hammer,Judge,Marshal,Sheriff,Enforcer,Ironhand,Stonewall,Bulwark,Guardian'],
 ['Shotguns',16,.8,22,7,0,'Breach,Ram,Thunder,Scatter,Mauler,Grizzly,Bison,Buckshot,Doorkicker,Torrent'],
 ['Marksman rifles',72,.65,90,1,0,'Watchman,Longbow,Overwatch,Tracker,Hawkeye,Spotter,Surveyor,Sightline,Lookout,Sharpsight'],
 ['Sniper rifles',125,1.3,130,1,0,'Horizon,Longshot,Ghost,Phantom,Whisper,Reaper,Zenith,Polaris,Northstar,Eclipse'],
 ['Machine guns',29,.11,70,1,0,'Barrage,Suppressor,Bastion,Fortress,Titan,Atlas,Goliath,Colossus,Juggernaut,Leviathan'],
 ['Launchers',100,1.6,65,1,4,'Comet,Meteor,Inferno,Volcano,Quake,Impact,Thunderbolt,Firestorm,Nova,Supernova']
];
const weapons=weaponClasses.flatMap((c,g)=>c[6].split(',').map((name,i)=>({id:g*10+i,name,group:g,damage:Math.round(c[1]*(.86+i*.035)),interval:c[2]*(.88+i*.03),range:Math.round(c[3]*(.85+i*.035)),pellets:c[4],blast:c[5]?c[5]+i*.15:0,length:[1,.8,.65,.5,.55,.95,1.15,1.35,1.05,.95][g],width:g===9?2.1:g===8?1.4:1})));
const uniforms=['#69765a','#ad956a','#515e6a','#3b4148'],skins=['#e2ba93','#b3946e','#875d42','#543b2e'],finishes=['#394940','#687789','#8d7959','#3e343f'];
const infantryClasses=[{name:'Assault',desc:'Balanced soldier: standard health and speed.',health:1,speed:1,regen:0},{name:'Recon',desc:'20% faster movement, 15% less health.',health:.85,speed:1.2,regen:0},{name:'Medic',desc:'Regenerate 2 health per second.',health:1,speed:1,regen:2},{name:'Heavy',desc:'35% more health, 20% slower movement.',health:1.35,speed:.8,regen:0}];
const difficulties=[{name:'Easy',desc:'Weaker enemies, lighter damage, slower reinforcements.',health:.75,damage:.55,cadence:1.3,spawn:1.4,initial:3},{name:'Normal',desc:'The standard battleground experience.',health:1,damage:1,cadence:1,spawn:1,initial:4},{name:'Hard',desc:'Tougher enemies, faster attacks and reinforcements.',health:1.35,damage:1.5,cadence:.8,spawn:.75,initial:5},{name:'Nightmare',desc:'Relentless attacks, heavy damage and stronger enemies.',health:1.8,damage:2.2,cadence:.6,spawn:.5,initial:7}];
const difficultySettings=()=>difficulties[mode==='infantry'?loadout.difficulty:1];
let loadout={soldierClass:0,difficulty:1,weapon:0,uniform:0,skin:1,helmet:0,finish:0};
try{const v=JSON.parse(localStorage.getItem('iron-dune-loadout'));if(v)for(const k of Object.keys(loadout)){const limit=k==='weapon'?100:k==='helmet'?3:4;if(Number.isInteger(v[k])&&v[k]>=0&&v[k]<limit)loadout[k]=v[k];}}catch(e){}
function saveLoadout(){try{localStorage.setItem('iron-dune-loadout',JSON.stringify(loadout));}catch(e){storageOK=false;}}
function loadoutMenu(){mode='infantry';state='loadout';$('hud').hidden=true;const w=weapons[loadout.weapon];
 const opts=(values,selected)=>values.map((v,i)=>'<option value="'+i+'" '+(i===selected?'selected':'')+'>'+v+'</option>').join('');
 show(`<div class="eyebrow">INFANTRY / FORWARD OPERATING BASE</div><h2>Build your loadout.</h2><p>100 weapons · 10 classes · No mid-run upgrade choices. XP and rebirth progression still save.</p><div class="loadout-layout"><aside class="loadout-sidebar" aria-label="Infantry setup sidebar"><span class="tag">PREPARE FOR DEPLOYMENT</span><label>SOLDIER CLASS<select id="soldierClass">${opts(infantryClasses.map(c=>c.name),loadout.soldierClass)}</select></label><p class="muted">${infantryClasses[loadout.soldierClass].desc}</p><label>DIFFICULTY<select id="difficultySelect">${opts(difficulties.map(d=>d.name),loadout.difficulty)}</select></label><p class="muted">${difficulties[loadout.difficulty].desc}</p><div class="card"><label>WEAPON CLASS<select id="weaponClass">${opts(weaponClasses.map(c=>c[0]),w.group)}</select></label><label>WEAPON<select id="weaponSelect">${weapons.filter(v=>v.group===w.group).map(v=>'<option value="'+v.id+'" '+(v.id===w.id?'selected':'')+'>'+v.name+'</option>').join('')}</select></label><strong>${w.name}</strong><small>${w.damage} damage × ${w.pellets} · ${Math.round(60/w.interval)} RPM<br>${w.range}m range · ${w.blast? w.blast.toFixed(1)+'m blast':'Direct fire'}</small></div></aside><div class="loadout-content"><div class="card"><label>UNIFORM<select id="uniformSelect">${opts(['Woodland','Desert','Urban','Night'],loadout.uniform)}</select></label><label>SKIN TONE<select id="skinSelect">${opts(['Light','Tan','Brown','Deep'],loadout.skin)}</select></label><label>HEADGEAR<select id="helmetSelect">${opts(['Combat helmet','Patrol cap','Beret'],loadout.helmet)}</select></label><label>WEAPON FINISH<select id="finishSelect">${opts(['Olive','Steel','Sand','Charcoal'],loadout.finish)}</select></label></div><div class="card"><span class="tag">YOUR SOLDIER</span><svg viewBox="0 0 160 210" width="160" height="210" role="img" aria-label="Selected soldier appearance"><path d="M54 129h23v64H54zM84 129h23v64H84zM45 63h70v74H45zM26 68h18v69H26zM116 68h18v69H116z" fill="${uniforms[loadout.uniform]}"/><path d="M57 25h46v37H57zM27 134h17v16H27zM116 134h17v16H116z" fill="${skins[loadout.skin]}"/><path d="${loadout.helmet===0?'M51 33V15h58v18z':loadout.helmet===1?'M52 29V18h57v11h12v6H52z':'M49 27l12-17h48v20z'}" fill="${loadout.helmet===2?'#8d3c3c':uniforms[loadout.uniform]}"/><path d="M51 77h58v43H51zM49 187h31v16H49zM82 187h31v16H82z" fill="#2e3c33"/><path d="M32 96h90v10H32zM83 101h13v23H83z" fill="${finishes[loadout.finish]}"/></svg><small>Uniform, skin tone, headgear and weapon finish save automatically. Your sleeves and hands match in first person.</small></div></div></div><p class="deployment-summary">${infantryClasses[loadout.soldierClass].name} · ${difficulties[loadout.difficulty].name} · ${w.name}</p><div class="actions"><button class="primary" id="deployInfantry">DEPLOY TO BATTLEGROUND →</button><button id="loadoutBack">MAIN MENU</button></div>`);
 $('soldierClass').onchange=e=>{loadout.soldierClass=+e.target.value;saveLoadout();loadoutMenu();};$('difficultySelect').onchange=e=>{loadout.difficulty=+e.target.value;saveLoadout();loadoutMenu();};
 $('weaponClass').onchange=e=>{loadout.weapon=+e.target.value*10;saveLoadout();loadoutMenu();};$('weaponSelect').onchange=e=>{loadout.weapon=+e.target.value;saveLoadout();loadoutMenu();};
 for(const k of ['uniform','skin','helmet','finish'])$(k+'Select').onchange=e=>{loadout[k]=+e.target.value;saveLoadout();loadoutMenu();};
 $('deployInfantry').onclick=()=>{start();captureMouse();};$('loadoutBack').onclick=menu;
}
// Cover blocks form streets, compounds, supply areas and a perimeter.
const battlefield=[];
function cover(x,z,w,h,l,color){battlefield.push({x,z,w,h,l,color});}
for(const side of [-1,1])for(let row=-2;row<=2;row++){
 cover(side*20,row*22,11,5+(row+2)%3*2,12,'#868775');
 cover(side*10,row*22+8,5,1.1,1,'#a49370');
 cover(side*34,row*22+8,3,2.6,9,'#526e66');
}
for(const side of [-1,1]){cover(side*59,0,2,4,120,'#656e65');cover(0,side*59,120,4,2,'#656e65');}
for(let i=0;i<7;i++)cover(-7+i*2,35,1.6,1.4,2,'#85714d');
function blocked(x,z,r=.4){return battlefield.some(b=>Math.abs(x-b.x)<b.w/2+r&&Math.abs(z-b.z)<b.l/2+r);}
function moveFoot(t,x,z){if(!blocked(x,t.z))t.x=x;if(!blocked(t.x,z))t.z=z;t.x=Math.max(-57,Math.min(57,t.x));t.z=Math.max(-57,Math.min(57,t.z));}
function coverDistance(x,y,z,dx,dy,dz,limit){let closest=limit;for(const b of battlefield){let lo=0,hi=closest;for(const [p,d,min,max] of [[x,dx,b.x-b.w/2,b.x+b.w/2],[y,dy,0,b.h],[z,dz,b.z-b.l/2,b.z+b.l/2]]){if(Math.abs(d)<1e-8){if(p<min||p>max){hi=-1;break;}}else{let a=(min-p)/d,c=(max-p)/d;if(a>c)[a,c]=[c,a];lo=Math.max(lo,a);hi=Math.min(hi,c);}}if(hi>=lo&&lo>=0)closest=Math.min(closest,lo);}return closest;}
function drawBattleground(){
 // Asphalt roads, curbs, lane markings and three-dimensional cover.
 box(0,-.07,0,13,.1,115,0,'#535e59');box(0,-.065,0,114,.1,9,0,'#535e59');
 for(let z=-50;z<=50;z+=8)box(0,.005,z,.12,.025,3,0,'#c7b981');
 paintFPSFaces();faces=[]; // Ground is behind all standing characters and cover.
 for(const b of battlefield){if(Math.hypot(b.x-player.x,b.z-player.z)>85)continue;box(b.x,b.h/2,b.z,b.w,b.h,b.l,0,b.color);if(b.h>=5){box(b.x,b.h+.12,b.z,b.w+.3,.24,b.l+.3,0,'#565f55');for(const side of [-1,1])for(let i=-1;i<=1;i++)box(b.x+side*(b.w/2+.015),2.6,b.z+i*3,.025,1.3,1.4,0,'#263b39');}else if(b.color==='#526e66'){for(let i=-3;i<=3;i++)box(b.x+b.w/2+.02,1.3,b.z+i,.04,2.4,.045,0,'#364f47');}}
}

const upgrades=[{name:'Sabot rounds',desc:'+25% cannon damage per level.',max:5,apply:()=>player.damage+=10},{name:'Autoloader',desc:'18% shorter reload per level.',max:5,apply:()=>player.reload*=.82},{name:'Composite armour',desc:'+35 maximum armour. Repair 35.',max:5,apply:()=>{player.max+=35;player.hp=Math.min(player.max,player.hp+35);}},{name:'Turbine tuning',desc:'+15% movement speed per level.',max:5,apply:()=>player.speed+=1.2},{name:'Field repairs',desc:'Regenerate +1.5 armour per second.',max:5,apply:()=>player.regen+=1.5},{name:'Blast radius',desc:'Shells explode over a wider area.',max:5,apply:()=>player.blast+=1.4},{name:'Twin strike',desc:'Fire an additional shell in a spread.',max:3,apply:()=>player.multi++},{name:'Battlefield salvage',desc:'Gain 25 commander XP, plus rebirth bonuses.',max:Infinity,apply:()=>{earnXP(25);}},{name:'Overcharged ammunition',desc:'+5 cannon damage. Can be chosen repeatedly.',max:Infinity,apply:()=>player.damage+=5},{name:'Emergency repair',desc:'Restore 45% of maximum armour.',max:Infinity,apply:()=>player.hp=Math.min(player.max,player.hp+player.max*.45)}];
const rebirthRequirement=()=>10+profile.rebirths*5;
const rebirthPower=()=>1+profile.rebirths*.1;
function earnXP(base){const amount=Math.round(base*(1+profile.rebirths*.2)),old=rank();profile.xp+=amount;runXP+=amount;profile.points+=rank()-old;save();}
function rebirthMenu(){
 state='rebirth';const eligible=rank()>=rebirthRequirement();
 show(`<div class="eyebrow">REBIRTH / PRESTIGE ${profile.rebirths}</div><h2>Start again. Come back stronger.</h2><p>Requires commander level ${rebirthRequirement()}. Your level: ${rank()}.</p><div class="cards"><div class="card"><span class="tag">AFTER REBIRTH</span><strong>+${(profile.rebirths+1)*10}% armour & damage</strong><small>+${(profile.rebirths+1)*20}% XP from kills and salvage.<br>Bonuses stack with your crew and motor pool.</small></div><div class="card"><span class="tag">RESETS</span><strong>Commander level → 1</strong><small>XP, unspent upgrade points, and all motor pool upgrade levels reset. Your current run ends.</small></div><div class="card"><span class="tag">KEEPS</span><strong>Your records</strong><small>Lifetime kills, best kill score, crew selection, and all rebirth bonuses stay.</small></div></div><div class="actions"><button id="confirmRebirth" class="primary" ${eligible?'':'disabled'}>${eligible?'CONFIRM REBIRTH '+(profile.rebirths+1):'LOCKED — REACH LEVEL '+rebirthRequirement()}</button><button id="cancelRebirth">CANCEL / MAIN MENU</button></div>`);
 $('confirmRebirth').onclick=performRebirth;$('cancelRebirth').onclick=menu;
}
function performRebirth(){
 if(state!=='rebirth'||rank()<rebirthRequirement())return false;
 profile.rebirths++;profile.xp=0;profile.points=0;profile.levels=[0,0,0];save();
 player=null;enemies=[];shells=[];particles=[];runXP=0;kills=0;time=0;menu();return true;
}
function clearInput(){keys.clear();mouse.down=false;}
function show(html){clearInput();if(document.pointerLockElement===canvas)document.exitPointerLock();$('overlay').hidden=false;$('panel').innerHTML=html;}
function menu(){state='menu';$('hud').hidden=true;show(`<div class="eyebrow">ROGUELITE TANK SURVIVAL / 3D</div><h1>IRON<br><span style="color:#eac477">DUNE.</span></h1><p>One Abrams. An endless armoured assault.<br>Destroy two tanks. Choose an upgrade. Build an unstoppable run.</p><div class="tag">COMMANDER LEVEL ${rank()} · ${profile.xp%200} / 200 XP · BEST ${profile.best} KILLS · REBIRTH ${profile.rebirths}</div><progress max="200" value="${profile.xp%200}"></progress><div class="cards">${crews.map((c,i)=>`<button class="card ${crew===i?'selected':''}" data-crew="${i}"><span class="tag">0${i+1} / ${c[0]}</span><strong>${c[1]}</strong><small>${c[2]}</small></button>`).join('')}</div><div class="actions"><button class="primary" id="deploy">DEPLOY ABRAMS →</button><button id="infantry">DEPLOY FPS INFANTRY →</button><a class="feedback" href="mailto:chibachaseygaming@gmail.com?subject=Iron%20Dune%20Feedback">✉ FEEDBACK</a><button id="garage">PERMANENT UPGRADES · ${profile.points} POINTS</button><button id="rebirth">REBIRTH ${profile.rebirths} · LEVEL ${rebirthRequirement()}</button></div><p class="muted">Desktop keyboard + mouse · Progress saves in this browser${storageOK?'':' · Saving unavailable in this browser session'}</p>`);document.querySelectorAll('[data-crew]').forEach(b=>b.onclick=()=>{crew=+b.dataset.crew;menu();});$('deploy').onclick=()=>{mode='tank';start();};$('infantry').onclick=loadoutMenu;$('garage').onclick=garage;$('rebirth').onclick=rebirthMenu;}
function garage(){show(`<div class="eyebrow">PERSISTENT PROGRESSION</div><h2>The motor pool</h2><p>Earn ${Math.round(25*(1+profile.rebirths*.2))} XP per kill. Every 200 XP earns one upgrade point.<br>${profile.points} points available · ${profile.kills} lifetime kills · Commander level ${rank()}</p><div class="cards">${['Reinforced hull','Cannon calibration','Engine refinement'].map((n,i)=>`<button class="card" data-buy="${i}" ${profile.points<1||profile.levels[i]>=5?'disabled':''}><span class="tag">LEVEL ${profile.levels[i]} / 5</span><strong>${n}</strong><small>${['+15 starting armour','+4 starting cannon damage','+5% starting speed'][i]} per level.<br>${profile.levels[i]>=5?'MAX LEVEL':'Cost: 1 point'}</small></button>`).join('')}</div><button id="back">← MAIN MENU</button>`);document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{const i=+b.dataset.buy;if(profile.points&&profile.levels[i]<5){profile.points--;profile.levels[i]++;save();garage();}});$('back').onclick=menu;}

// Clip polygons at the near plane before perspective division.

function paintFPSFaces(){faces.sort((a,b)=>a.d-b.d);for(const f of faces){const pts=clipFPS(f.pts);if(pts.length<3)continue;ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.fillStyle=shadeColor(f.color,f.shade);ctx.fill();}}
